<!DOCTYPE html>
<html>

<head>

<title>Rent Report</title>

<style>

body{
    font-family:Arial;
    background:#f3f4f6;
    margin:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#2563eb;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.green{
    color:green;
    font-weight:bold;
}

.red{
    color:red;
    font-weight:bold;
}


/* ===== AFRIAXIS V6 STANDALONE DARK THEME ===== */

*{
    box-sizing:border-box;
}

html,
body{
    background:
        radial-gradient(
            circle at top right,
            rgba(59,130,246,.08),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #07111f,
            #091524
        ) !important;

    color:#f8fafc !important;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

h1,
h2,
h3,
h4{
    color:#f8fafc !important;
}

p,
label{
    color:#94a3b8 !important;
}

a{
    color:#60a5fa;
}

.card,
.container,
.panel,
.receipt,
.box,
.summary,
.metric{
    background:
        linear-gradient(
            145deg,
            #142235,
            #0d1928
        ) !important;

    color:#f8fafc !important;

    border:
        1px solid #26384e !important;

    box-shadow:
        0 10px 30px rgba(0,0,0,.18) !important;
}

table{
    background:#142235 !important;
    color:#f8fafc !important;
    border-color:#26384e !important;
}

th{
    background:#101e2f !important;
    color:#cbd5e1 !important;
    border-color:#26384e !important;
}

td{
    background:#142235 !important;
    color:#e2e8f0 !important;
    border-color:#26384e !important;
}

tbody tr:nth-child(even) td{
    background:#101e2f !important;
}

input,
select,
textarea{
    background:#0d1928 !important;
    color:#f8fafc !important;
    border:1px solid #26384e !important;
}

input::placeholder,
textarea::placeholder{
    color:#64748b !important;
}

button,
.btn{
    border-radius:10px !important;
}

button{
    background:#2563eb;
    color:#fff;
    border:0;
}

@media(max-width:700px){

    body{
        margin:0 !important;
        padding:10px !important;
    }

    h1{
        font-size:20px !important;
    }

    h2{
        font-size:14px !important;
    }

    .card,
    .container,
    .panel,
    .receipt,
    .box,
    .summary,
    .metric{
        border-radius:14px !important;
        padding:13px !important;
    }

    table{
        font-size:10px !important;
    }

    th,
    td{
        padding:8px !important;
    }

    input,
    select,
    textarea{
        width:100% !important;
        min-height:42px;
        font-size:12px !important;
    }

    button,
    .btn{
        min-height:40px;
        font-size:11px !important;
    }
}

</style>

</head>

<body>

<h1>AfriAxis Monthly Rent Report</h1>

<div class="card">

<h2>Grand Total: KES {{ grand_total }}</h2>

<h2 class="green">
Paid: KES {{ grand_paid }}
</h2>

<h2 class="red">
Unpaid: KES {{ grand_unpaid }}
</h2>

</div>

<table>

<tr>
<th>Apartment</th>
<th>Total Rent</th>
<th>Paid</th>
<th>Unpaid</th>
</tr>

{% for row in rows %}

<tr>
<td>{{ row.apartment }}</td>
<td>KES {{ row.total }}</td>
<td class="green">KES {{ row.paid }}</td>
<td class="red">KES {{ row.unpaid }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
