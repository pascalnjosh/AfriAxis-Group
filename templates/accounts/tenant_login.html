<!DOCTYPE html>
<html>
<head>
<title>AfriAxis Tenant Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ===== AFRIAXIS TENANT LOGIN V5 ===== */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top right,rgba(34,197,94,.14),transparent 30%),
        linear-gradient(145deg,#061426,#0b2446);
}

.login-shell{
    width:100%;
    max-width:390px;
}

.brand{
    text-align:center;
    margin-bottom:20px;
}

.logo{
    width:60px;
    height:60px;
    margin:0 auto 12px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:white;
    font-size:30px;
    font-weight:900;
    box-shadow:0 10px 30px rgba(34,197,94,.24);
}

.brand-small{
    color:#4ade80;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
}

.brand h1{
    color:#fff;
    font-size:24px;
    margin:6px 0 4px;
}

.brand p{
    color:#9fb4cf;
    margin:0;
    font-size:11px;
}

.login-card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    box-shadow:0 18px 50px rgba(0,0,0,.24);
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    margin-bottom:6px;
    color:#334155;
    font-size:11px;
    font-weight:800;
}

.field input{
    width:100%;
    min-height:46px;
    border:1px solid #dbe4ee;
    border-radius:11px;
    padding:10px 12px;
    font-size:13px;
    outline:none;
}

.field input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

button{
    width:100%;
    min-height:46px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#0d2850,#2563eb);
    color:white;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
}

.error{
    background:#fef2f2;
    color:#b91c1c;
    border:1px solid #fecaca;
    padding:10px 12px;
    border-radius:10px;
    font-size:11px;
    margin-bottom:14px;
}

.footer{
    margin-top:14px;
    text-align:center;
    color:#9fb4cf;
    font-size:9px;
}

</style>
</head>

<body>

<div class="login-shell">

    <div class="brand">
        <div class="logo">A</div>
        <div class="brand-small">AFRIAXIS V5</div>
        <h1>Tenant Portal</h1>
        <p>Secure access to your account and billing information.</p>
    </div>

    <div class="login-card">

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/tenant/login/">
            {% csrf_token %}

            <div class="field">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">
                Sign In
            </button>

        </form>

    </div>

    <div class="footer">
        AfriAxis Group Kenya
    </div>

</div>

</body>
</html>
